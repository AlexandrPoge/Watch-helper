services:
  - type: web
    name: watch-helper
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/ready
    envVars:
      - key: BEHIND_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: watch-helper-db
          property: connectionString
      - key: TMDB_API_KEY
        sync: false

databases:
  - name: watch-helper-db
    plan: free
    region: frankfurt
    ipAllowList: []
